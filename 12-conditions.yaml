- name: install nginx based on the os family
  hosts: local
  connection: local
  tasks:
  - name: install nginx if os_family is RedHat
    ansible.builtin.dnf:
      name: nginx
      state: present
    when: ansible_os_family = RedHat

  - name: install nginx if os_family is debian 
    ansible.builtin.apt:
      name: nginx
      state: present
    when: ansible_os_family = Debain
     
